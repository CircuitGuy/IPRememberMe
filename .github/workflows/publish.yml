name: Publish Container

on:
  push:
    branches: ["main"]
    tags: ["v*"]

env:
  IMAGE_DESCRIPTION: "Adds an Authelia 2nd factor that trusts an IP after one login before exposing a self-hosted login screen; simple status/admin UI; everything stored in memory only."

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/iprememberme
          annotations: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Annotate manifests with description
        env:
          IMAGE_DESCRIPTION: ${{ env.IMAGE_DESCRIPTION }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            echo "Annotating ${tag} with description"
            docker buildx imagetools create --tag "$tag" --annotation "org.opencontainers.image.description=${IMAGE_DESCRIPTION}" "$tag"
          done
