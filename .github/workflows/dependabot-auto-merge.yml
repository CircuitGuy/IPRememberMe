name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge via API (skip majors)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullId = context.payload.pull_request.node_id;
            const result = await github.graphql(`
              mutation($pullId: ID!, $method: PullRequestMergeMethod!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $pullId, mergeMethod: $method}) {
                  pullRequest { number autoMergeRequest { enabledAt } }
                }
              }
            `, { pullId, method: "SQUASH" });
            core.info(`Auto-merge enabled: ${JSON.stringify(result)}`);
